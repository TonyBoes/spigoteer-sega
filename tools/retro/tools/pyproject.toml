[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrotools"
version = "0.1.0"
description = "Agent-facing harness for the retro devcontainer variants: stable-retro driver, MesenCE accuracy gate, symbols, sprite and level converters"
requires-python = ">=3.11"
dependencies = ["stable-retro", "pillow", "numpy"]

[project.scripts]
retrotest   = "retrotools.cli:main"
retrocheck  = "retrotools.check:main"
retrosprite = "retrotools.sprite:main"
retrolevel  = "retrotools.level:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["retrotools*"]
