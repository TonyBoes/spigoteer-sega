<title>Spigoteer Review Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column of cards, one per open question whose animation or large item will not fit on Open Questions; empty when none. */
:root {
  --ground: #f3efe6;
  --card: #fffdf8;
  --ink: #23201b;
  --muted: #6c655a;
  --rule: #ddd5c6;
  --amber: #b5701c;
  --stage: #2c5060;
  --display: "Silkscreen", "IBM Plex Mono", ui-monospace, monospace;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #17181b; --card: #202227; --ink: #ece6da; --muted: #a49d90; --rule: #34363c; --amber: #e7a54a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #17181b; --card: #202227; --ink: #ece6da; --muted: #a49d90; --rule: #34363c; --amber: #e7a54a;
}
html, body { background: var(--ground); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.55; padding: 24px 16px 48px; }
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 22px; }
h1 { font-family: var(--display); font-size: 26px; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.lede { margin: 4px 0 0; color: var(--muted); max-width: 64ch; }
.stamp { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 18px; display: grid; gap: 12px; }
.tag { font-family: var(--display); font-size: 13px; color: var(--amber); letter-spacing: .06em; }
.card h2 { margin: 0; font-size: 18px; text-wrap: balance; }
.card p { margin: 0; max-width: 66ch; }
.ask { font-weight: 600; }
.media { background: var(--stage); border-radius: 8px; padding: 12px; overflow-x: auto; }
.media img { display: block; max-width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; margin: 0 auto; }
.note { font-size: 13px; color: var(--muted); }
.ref .tag { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .media img { animation: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Spigoteer review board</h1>
    <p class="lede">Animations and large items for an open question, when they will not fit on the Open Questions page. Cleared once answered.</p>
    <p class="stamp">Updated 2026-10-25 · main cff5f5c · graphics atlas: claude.ai/artifact/RLQysU9fNNbcZR2TS8x5XZ</p>
  </header>

  <p class="lede">Nothing here right now.</p>
</div>
