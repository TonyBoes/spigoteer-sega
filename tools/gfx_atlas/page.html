<title>Spigoteer Graphics Atlas</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #61615b; --line: #d4d4cc; --soft: #ecece6;
  --accent: #1a5fc4; --accent-ink: #ffffff; --ok: #1d7a4a; --warn: #a5560b; --bad: #b3261e;
  --chip-perm: #d8efe2; --chip-perm-ink: #14583a; --chip-venue: #fde8cc; --chip-venue-ink: #7a3f06;
  --chip-anim: #f6d9f0; --chip-anim-ink: #7a1f6b; --chip-off: #e4e4de; --chip-off-ink: #55554f;
  --focus: #1a5fc4; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141416; --panel: #1d1d20; --ink: #e9e9e4; --muted: #a0a099; --line: #38383d; --soft: #28282c;
    --accent: #6fa6ff; --accent-ink: #0b1a33; --ok: #5ccf94; --warn: #f0a24a; --bad: #ff8a80;
    --chip-perm: #1c3b2c; --chip-perm-ink: #9be3bd; --chip-venue: #43300f; --chip-venue-ink: #f5c98a;
    --chip-anim: #432047; --chip-anim-ink: #f0b6ea; --chip-off: #2e2e32; --chip-off-ink: #a9a9a2;
    --focus: #6fa6ff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141416; --panel: #1d1d20; --ink: #e9e9e4; --muted: #a0a099; --line: #38383d; --soft: #28282c;
  --accent: #6fa6ff; --accent-ink: #0b1a33; --ok: #5ccf94; --warn: #f0a24a; --bad: #ff8a80;
  --chip-perm: #1c3b2c; --chip-perm-ink: #9be3bd; --chip-venue: #43300f; --chip-venue-ink: #f5c98a;
  --chip-anim: #432047; --chip-anim-ink: #f0b6ea; --chip-off: #2e2e32; --chip-off-ink: #a9a9a2;
  --focus: #6fa6ff;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding-inline: 16px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 16px; margin: 0 0 8px; }
h3 { font-size: 14px; margin: 14px 0 6px; }
small, .muted { color: var(--muted); }
code, .mono { font-family: var(--mono); font-size: 12px; }
button, select, input { font: inherit; color: var(--ink); }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button[aria-pressed="true"], button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 12px; border-bottom: 1px solid var(--line); }
header.top .gen { color: var(--muted); font-size: 12px; flex: 1 1 260px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; padding-block: 16px 40px; align-items: start; }
nav.picker { position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
nav.picker details { margin-block: 2px; }
nav.picker summary { cursor: pointer; font-weight: 600; padding: 4px 6px; border-radius: 4px; }
nav.picker summary:hover { background: var(--soft); }
nav.picker a { display: block; padding: 3px 8px 3px 16px; color: var(--ink); text-decoration: none; border-radius: 4px; font-size: 13px; }
nav.picker a:hover { background: var(--soft); }
nav.picker a[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
nav.picker a.nomodel { color: var(--muted); }
.picker-select { display: none; width: 100%; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 16px; min-width: 0; }
.scroll { overflow-x: auto; max-width: 100%; }
.pix { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.stage { position: relative; display: inline-block; line-height: 0; background: #000; border: 1px solid var(--line); }
.stage canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
.stage canvas.hit { pointer-events: auto; }
.chip { display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 7px; border-radius: 10px; margin-left: 4px; white-space: nowrap; }
.chip.perm { background: var(--chip-perm); color: var(--chip-perm-ink); }
.chip.venue { background: var(--chip-venue); color: var(--chip-venue-ink); }
.chip.anim { background: var(--chip-anim); color: var(--chip-anim-ink); }
.chip.off { background: var(--chip-off); color: var(--chip-off-ink); }
.pal { border-collapse: collapse; width: 100%; }
.pal td, .pal th { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: middle; text-align: left; }
.pal th { font-weight: 600; font-size: 12px; color: var(--muted); }
.pal tr.unused { opacity: .45; }
.sw { display: inline-flex; gap: 0; vertical-align: middle; }
.sw button.c { display: block; width: 26px; height: 22px; padding: 0; margin: 0; border: 1px solid var(--line); border-left-width: 0; border-radius: 0; cursor: copy; position: relative; }
.sw button.c:first-child { border-left-width: 1px; border-radius: 3px 0 0 3px; }
.sw button.c:last-child { border-radius: 0 3px 3px 0; }
.sw button.c:hover { border-color: var(--accent); z-index: 1; }
.sw button.c:focus-visible { z-index: 2; outline-offset: 1px; }
.sw.big button.c { width: 34px; height: 28px; }
.sw.mini button.c { width: 10px; height: 12px; }
.pgrid { display: block; }
.prow { display: grid; grid-template-columns: minmax(150px, 1fr) max-content minmax(150px, 1.1fr) minmax(0, 2.6fr); gap: 6px 16px; align-items: center; padding: 8px 6px; border-top: 1px solid var(--line); }
.pgrid.nospr .prow { grid-template-columns: minmax(150px, 1fr) max-content minmax(150px, 1.6fr); }
.prow.head { border-top: 0; padding-block: 2px; font-weight: 600; font-size: 12px; color: var(--muted); }
.prow.unused > :not(.pspr) { opacity: .5; }
.prow > div { min-width: 0; }
.sprs { display: flex; flex-wrap: wrap; gap: 3px; align-items: flex-start; }
.spr { flex: none; background-color: var(--soft); border: 1px solid var(--line); background-repeat: no-repeat; image-rendering: pixelated; image-rendering: crisp-edges; }
.sprs .more { align-self: center; font-size: 12px; color: var(--muted); padding-inline: 4px; }
#tip, #toast { position: fixed; z-index: 50; max-width: min(92vw, 360px); font-size: 12px; line-height: 1.4; padding: 5px 9px; border-radius: 6px; background: var(--ink); color: var(--bg); box-shadow: 0 2px 8px rgba(0,0,0,.3); pointer-events: none; }
#toast { pointer-events: auto; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
#toast input { display: block; width: 100%; margin-top: 4px; font: 12px var(--mono); padding: 3px 5px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }
#toast.fail { background: var(--warn); color: var(--bg); }
.strip { display: block; image-rendering: pixelated; border: 1px solid var(--line); }
table.data { border-collapse: collapse; width: 100%; font-size: 12px; }
table.data th, table.data td { border-top: 1px solid var(--line); padding: 3px 8px; text-align: left; white-space: nowrap; }
table.data th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
table.data td.num, table.data th.num { text-align: right; font-family: var(--mono); }
table.data tr.sel td { background: var(--soft); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; margin: 6px 0; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend b { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--line); }
.note { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
.err { color: var(--bad); }
table.free td.fp { white-space: normal; min-width: 96px; font-size: 12px; vertical-align: top; border-left: 1px solid var(--line); }
table.free td.fp.always { background: var(--chip-perm); color: var(--chip-perm-ink); }
table.free td.fp.event { background: var(--chip-venue); color: var(--chip-venue-ink); }
table.free td.fp.free { background: var(--chip-anim); color: var(--chip-anim-ink); font-weight: 700; }
table.free th[scope=row] { white-space: normal; min-width: 120px; position: sticky; left: 0; background: var(--panel); }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; }
.readout { font-family: var(--mono); font-size: 12px; min-height: 2.8em; margin-top: 6px; color: var(--muted); }
.gutter { display: grid; grid-template-columns: 34px max-content; gap: 0; align-items: start; }
.gutter .rows { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.gutter .rows div { text-align: right; padding-right: 4px; }
.groups { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.grp { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; cursor: default; }
details.more > summary { cursor: pointer; color: var(--accent); font-size: 12px; margin: 4px 0; }
.sel-id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
@media (max-width: 760px) {
  .prow, .pgrid.nospr .prow { grid-template-columns: minmax(0, 1fr) max-content; }
  .prow.head { display: none; }
  .prow .pstat, .prow .pspr { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { #tip, #toast { transition: none; } }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.picker { display: none; }
  .picker-select { display: block; }
}
</style>

<header class="top">
  <h1>Spigoteer Graphics Atlas</h1>
  <div class="seg" role="group" aria-label="Game Boy model">
    <button id="m-dmg" type="button" aria-pressed="false">DMG</button>
    <button id="m-cgb" type="button" aria-pressed="true">CGB</button>
  </div>
  <button id="motion" type="button" aria-pressed="true" title="Animated swatches and the animation preview">Animation: playing</button>
  <div class="gen" id="gen">loading...</div>
</header>

<div class="layout">
  <div>
    <select id="pick-select" class="picker-select" aria-label="Screen"></select>
    <nav class="picker" id="picker" aria-label="Screens"></nav>
  </div>
  <main id="main" tabindex="-1"><p class="muted">Loading the atlas data...</p></main>
</div>

<script src="data/index.js"></script>
<script>
"use strict";
(function () {
  var A = window.ATLAS = window.ATLAS || {};
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function h(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) { c.forEach(function (x) { e.appendChild(x); }); continue; }
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return e;
  }
  var mobile = window.matchMedia("(max-width: 560px)");
  function scale() { return mobile.matches ? 2 : 3; }

  var GROUP_ORDER = ["Menus", "Levels (ARCADE, by venue)", "Levels (CLASSIC, mirrored)", "Dancers' show (by venue)", "Bosses", "Boss entrances",
                     "Mini-games", "Story", "Credits", "Pause and cards", "Other"];
  var state = { id: null, model: "cgb", motion: !window.matchMedia("(prefers-reduced-motion: reduce)").matches, bank: 0,
                tiles: { used: true, colour: false, regions: false, region: -1 }, ov: { attr: false, spr: false, grid: false }, summary: false, free: false };
  var animSwatches = [];     // {cells:[i,i,i,i], changes:[[t,[c..]]], frames}
  var clock0 = performance.now();
  var BAND = { obj: "#e08a2c", pool: "#3a7bd5", shared: "#2a9d6f", patron: "#b04fb0", free: "#8a8a84" };
  var PALCOL = ["#e6194b", "#3cb44b", "#ffe119", "#4363d8", "#f58231", "#911eb4", "#46f0f0", "#f032e6"];
  var SCOPE = { perm: "permanent", venue: "reloaded per venue", free: "free" };

  // ---- helpers -------------------------------------------------------------------------------------------------------------------
  function rgb(c) { return [(c & 31) << 3, ((c >> 5) & 31) << 3, ((c >> 10) & 31) << 3]; }
  function hex(c) { var r = rgb(c); return "#" + r.map(function (v) { return ("0" + v.toString(16)).slice(-2); }).join(""); }
  function w16(c) { return "0x" + ("000" + c.toString(16).toUpperCase()).slice(-4); }
  var DMG = ["#ffffff", "#999999", "#555555", "#000000"];
  function idx() { return A.index; }
  function scrById(id) { var s = idx().screens; for (var i = 0; i < s.length; i++) if (s[i].id === id) return s[i]; return null; }
  function defId() { return scrById("level_cowboys") ? "level_cowboys" : idx().screens[0].id; }
  function nameOf(id) { var s = scrById(id); return s ? s.name : id; }
  function roleOf(kind, slot) { var r = idx().roles; return (kind === "bg" ? r.bg : r.obj)[slot]; }

  // A swatch is a row of buttons, one per colour: click / tap / Enter copies "#RRGGBB"; hover or focus shows both values.
  // vals: RGB555 words (CGB) or shade indices 0-3 (DMG, opt.dmg = register name, opt.reg = its value); opt.what names the palette.
  function cellInfo(b) {
    var v = b._v;
    if (b._dmg) return { hex: DMG[v], toast: "DMG shade " + v, tip: DMG[v] + "  |  DMG shade " + v + " of " + b._dmg + " 0x" + (b._reg || 0).toString(16).toUpperCase() };
    return { hex: hex(v), toast: "RGB555 " + w16(v), tip: hex(v) + "  |  RGB555 " + w16(v) };
  }
  function setCell(b, v, reg) {
    if (reg != null) b._reg = reg;
    if (b._v === v && reg == null) return;
    b._v = v;
    b.style.background = b._dmg ? DMG[v] : hex(v);
    var i = cellInfo(b);
    b.setAttribute("aria-label", b._what + ": " + i.tip.replace(/\s*\|\s*/g, ", ") + ". Click to copy " + i.hex);
  }
  function swatch(vals, cls, opt) {
    opt = opt || {};
    var s = h("span", { class: "sw " + (cls || "") });
    var cells = [];
    vals.forEach(function (v, k) {
      var b = h("button", { type: "button", class: "c" });
      b._dmg = opt.dmg || null; b._what = (opt.what || "palette") + " colour " + k;
      setCell(b, v, opt.reg);
      b.addEventListener("click", function () { copyColour(b); });
      b.addEventListener("mouseenter", function () { showTip(b); });
      b.addEventListener("focus", function () { showTip(b); });
      b.addEventListener("mouseleave", hideTip);
      b.addEventListener("blur", hideTip);
      s.appendChild(b); cells.push(b);
    });
    s.cells = cells;
    return s;
  }
  var tipEl, toastEl, toastTimer;
  function floatEl(el, anchor) {
    el.hidden = false;
    var r = anchor.getBoundingClientRect(), w = el.offsetWidth, hh = el.offsetHeight;
    var left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 8));
    var top = r.bottom + 6;
    if (top + hh > window.innerHeight - 4) top = Math.max(4, r.top - hh - 6);
    el.style.left = left + "px"; el.style.top = top + "px";
  }
  function showTip(b) {
    if (!tipEl) { tipEl = h("div", { id: "tip", role: "tooltip", hidden: "" }); document.body.appendChild(tipEl); }
    if (toastEl && !toastEl.hidden && !toastEl.querySelector("input")) hideToast();
    tipEl.textContent = b._what + ": " + cellInfo(b).tip + "  (click to copy)";
    floatEl(tipEl, b);
  }
  function hideTip() { if (tipEl) tipEl.hidden = true; }
  function hideToast() { if (toastEl) toastEl.hidden = true; clearTimeout(toastTimer); }
  function toast(b, msg, manual) {
    if (!toastEl) {
      toastEl = h("div", { id: "toast", role: "status", "aria-live": "polite", hidden: "" });
      document.body.appendChild(toastEl);
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideToast(); });
      document.addEventListener("pointerdown", function (e) { if (toastEl && !toastEl.hidden && !toastEl.contains(e.target)) hideToast(); });
    }
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.className = manual ? "fail" : "";
    var inp = null;
    if (manual) {
      inp = h("input", { type: "text", readonly: "", "aria-label": "Colour value, selected for copying", value: manual });
      toastEl.appendChild(inp);
    }
    hideTip();
    floatEl(toastEl, b);
    if (inp) { inp.focus(); inp.select(); inp.setSelectionRange(0, inp.value.length); }
    else toastTimer = setTimeout(hideToast, 1800);
  }
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.setAttribute("aria-hidden", "true");
    ta.style.cssText = "position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;";
    document.body.appendChild(ta);
    var ok = false;
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function copyColour(b) {
    var i = cellInfo(b), text = i.hex;
    var okMsg = "Copied " + text + " (" + i.toast + ")";
    function manual() { toast(b, text + " (" + i.toast + "): press Ctrl+C / long-press to copy", text); }
    function legacy() { if (legacyCopy(text)) toast(b, okMsg); else manual(); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(b, okMsg); }, legacy);
      else legacy();
    } catch (e) { legacy(); }
  }

  // ---- sprite images: CSS crops of the packed PNG (transparent ground, drawn with the palette the game used) ---------------------
  function sprBox(png, W, H, x, y, w, hh, S, label) {
    return h("div", { class: "spr", role: "img", "aria-label": label, title: label,
      style: "width:" + w * S + "px;height:" + hh * S + "px;background-image:url(" + png + ");background-position:" + (-x * S) + "px " + (-y * S) + "px;background-size:" + (W * S) + "px " + (H * S) + "px" });
  }
  // g: {slot, total, items:[[tile, bank, xflip, yflip, h, n]]}; sheet {png, w, h, x, y}: the slot's row starts at (x, y + slot * 16)
  function sprites(g, sheet, unit) {
    var S = mobile.matches ? 2 : 3, wrap = h("div", { class: "sprs" });
    if (!g || !g.total) { wrap.appendChild(h("span", { class: "muted", text: "no sprite uses it here" })); return wrap; }
    g.items.forEach(function (it, i) {
      var lab = "tile 0x" + ("0" + it[0].toString(16)).slice(-2).toUpperCase() + (it[1] ? ", bank 1" : "") + (it[2] ? ", flip X" : "") + (it[3] ? ", flip Y" : "") +
        ", " + it[4] + " px tall; seen " + (unit === "screens" ? "on " + it[5] + " screen" + (it[5] === 1 ? "" : "s") : "in " + it[5] + " sample" + (it[5] === 1 ? "" : "s"));
      wrap.appendChild(sprBox(sheet.png, sheet.w, sheet.h, sheet.x + i * 8, sheet.y + g.slot * 16, 8, it[4], S, lab));
    });
    if (g.total > g.items.length) wrap.appendChild(h("span", { class: "more", text: "+" + (g.total - g.items.length) + " more" }));
    return wrap;
  }
  function chip(text, cls, title) { return h("span", { class: "chip " + cls, text: text, title: title || "" }); }

  // ---- loading -------------------------------------------------------------------------------------------------------------------
  function load(id, cb) {
    if (A[id]) { cb(); return; }
    var s = document.createElement("script");
    s.src = "data/" + id + ".js";
    s.onload = cb;
    s.onerror = function () { $("#main").textContent = "Could not load data/" + id + ".js"; };
    document.head.appendChild(s);
  }

  // ---- picker --------------------------------------------------------------------------------------------------------------------
  function buildPicker() {
    var nav = $("#picker"), sel = $("#pick-select");
    nav.textContent = ""; sel.textContent = "";
    var by = {};
    idx().screens.forEach(function (s) { (by[s.group] = by[s.group] || []).push(s); });
    var order = GROUP_ORDER.filter(function (g) { return by[g]; }).concat(Object.keys(by).filter(function (g) { return GROUP_ORDER.indexOf(g) < 0; }));
    var top = h("a", { href: "#summary", text: "Summary: permanent vs swapped", "data-id": "summary" });
    nav.appendChild(top);
    nav.appendChild(h("a", { href: "#free", text: "Free sprite palettes", "data-id": "free" }));
    sel.appendChild(h("option", { value: "free", text: "Free sprite palettes" }));
    sel.appendChild(h("option", { value: "summary", text: "Summary: permanent vs swapped" }));
    order.forEach(function (g) {
      var d = h("details", { open: "" }, h("summary", { text: g + " (" + by[g].length + ")" }));
      var og = h("optgroup", { label: g });
      by[g].forEach(function (s) {
