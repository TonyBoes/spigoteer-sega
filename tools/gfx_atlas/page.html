<title>Spigoteer Graphics Atlas</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #61615b; --line: #d4d4cc; --soft: #ecece6;
  --accent: #1a5fc4; --accent-ink: #ffffff; --ok: #1d7a4a; --warn: #a5560b; --bad: #b3261e;
  --chip-perm: #d8efe2; --chip-perm-ink: #14583a; --chip-venue: #fde8cc; --chip-venue-ink: #7a3f06;
  --chip-anim: #f6d9f0; --chip-anim-ink: #7a1f6b; --chip-off: #e4e4de; --chip-off-ink: #55554f;
  --focus: #1a5fc4; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141416; --panel: #1d1d20; --ink: #e9e9e4; --muted: #a0a099; --line: #38383d; --soft: #28282c;
    --accent: #6fa6ff; --accent-ink: #0b1a33; --ok: #5ccf94; --warn: #f0a24a; --bad: #ff8a80;
    --chip-perm: #1c3b2c; --chip-perm-ink: #9be3bd; --chip-venue: #43300f; --chip-venue-ink: #f5c98a;
    --chip-anim: #432047; --chip-anim-ink: #f0b6ea; --chip-off: #2e2e32; --chip-off-ink: #a9a9a2;
    --focus: #6fa6ff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141416; --panel: #1d1d20; --ink: #e9e9e4; --muted: #a0a099; --line: #38383d; --soft: #28282c;
  --accent: #6fa6ff; --accent-ink: #0b1a33; --ok: #5ccf94; --warn: #f0a24a; --bad: #ff8a80;
  --chip-perm: #1c3b2c; --chip-perm-ink: #9be3bd; --chip-venue: #43300f; --chip-venue-ink: #f5c98a;
  --chip-anim: #432047; --chip-anim-ink: #f0b6ea; --chip-off: #2e2e32; --chip-off-ink: #a9a9a2;
  --focus: #6fa6ff;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding-inline: 16px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h2 { font-size: 20px; margin: 0 0 2px; font-weight: 650; }
h3 { font-size: 13px; margin: 18px 0 6px; color: var(--muted); font-weight: 600; letter-spacing: .01em; }
small, .muted { color: var(--muted); }
code, .mono { font-family: var(--mono); font-size: 12px; }
button, input { font: inherit; color: var(--ink); }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button[aria-pressed="true"], button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar: the picker button, the model toggle, the commit line */
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px; max-width: 1240px; margin-inline: auto; }
header.top .gen { color: var(--muted); font-size: 11.5px; flex: 1 1 200px; min-width: 0; }
.pick-wrap { position: relative; }
#pick-btn { display: inline-flex; align-items: center; gap: 8px; max-width: min(78vw, 420px); font-weight: 600; padding: 7px 12px; }
#pick-btn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav.picker { position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; width: min(440px, calc(100vw - 32px)); max-height: min(72vh, 640px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.22); }
nav.picker details { margin-block: 2px; }
nav.picker summary { cursor: pointer; font-weight: 600; padding: 6px 8px; border-radius: 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
nav.picker summary:hover { background: var(--soft); }
nav.picker a { display: block; padding: 6px 12px; color: var(--ink); text-decoration: none; border-radius: 6px; }
nav.picker a:hover { background: var(--soft); }
nav.picker a[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
nav.picker a.nomodel { color: var(--muted); }
nav.picker a.top1 { font-weight: 600; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; padding-inline: 12px; }
.seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.seg button:last-child { border-radius: 0 8px 8px 0; }

main { max-width: 1240px; margin-inline: auto; padding-block: 8px 56px; display: block; min-width: 0; }
.crumb { margin: 0 0 4px; }
.sel-id { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 0 0 14px; }
.scroll { overflow-x: auto; max-width: 100%; }
.pix { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.err { color: var(--bad); }
.note { color: var(--muted); font-size: 13px; margin: 6px 0 10px; max-width: 80ch; }

/* sections: a button-like header (chevron, name, one-line budget) that opens its content */
details.sec { background: var(--panel); border-radius: 12px; margin-bottom: 10px; }
details.sec > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 10px; align-items: baseline; padding: 14px 16px; border-radius: 12px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary:hover { background: var(--soft); }
details.sec > summary .st { font-weight: 650; font-size: 15px; }
details.sec > summary .sum { grid-column: 2; color: var(--muted); font-size: 13px; }
.chev { grid-row: 1; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); margin-left: 4px; align-self: center; transition: transform .15s; }
details[open] > summary > .chev { transform: rotate(45deg); }
details.sec > summary .st { grid-column: 2; grid-row: 1; }
details.sec[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.sbody { padding: 4px 16px 18px 46px; min-width: 0; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

details.info, details.more { margin: 8px 0; }
details.info > summary, details.more > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; display: inline-block; padding: 3px 9px; border-radius: 14px; background: var(--soft); list-style: none; }
details.info > summary::-webkit-details-marker, details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+ "; }
details.more[open] > summary::before { content: "\2212 "; }
details.info > summary:hover, details.more > summary:hover { color: var(--ink); }
details.info[open] > summary, details.more[open] > summary { margin-bottom: 8px; }
details.more > .mbody { padding-left: 2px; }

/* the still and its overlay */
.stage { position: relative; display: inline-block; line-height: 0; background: #000; border-radius: 6px; overflow: hidden; }
.stage canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
.stage canvas.hit { pointer-events: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; margin: 6px 0; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend b { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--line); }
.readout { font-family: var(--mono); font-size: 12px; min-height: 2.8em; margin-top: 6px; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: 12px; }

/* constructed objects */
.ocards { display: grid; gap: 22px; }
.ocard .oname { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin-bottom: 8px; }
.ocard .ometa { color: var(--muted); font-size: 12.5px; }
.figs { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end; }
figure.fig { margin: 0; text-align: center; max-width: 140px; }
figure.fig figcaption { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.3; }
.spr { flex: none; background-repeat: no-repeat; image-rendering: pixelated; image-rendering: crisp-edges; background-color: var(--soft); border-radius: 3px; }
.sprs { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-start; }
.sprs .more { align-self: center; font-size: 12px; color: var(--muted); padding-inline: 4px; }
.pieces-row { display: flex; flex-wrap: wrap; gap: 10px 20px; margin: 6px 0 10px; align-items: flex-end; }
.pieces-row .lab { font-size: 11.5px; color: var(--muted); width: 100%; }
.piece { text-align: center; font-size: 10.5px; color: var(--muted); line-height: 1.3; }

/* palettes */
.pgrid { display: grid; }
.prow { display: grid; grid-template-columns: minmax(150px, 230px) max-content minmax(0, 1fr); gap: 6px 22px; align-items: center; padding: 10px 0; }
.prow + .prow { border-top: 1px solid var(--soft); }
.prow .pname b { font-size: 14px; }
.prow .pname .rl { color: var(--muted); font-size: 12.5px; display: block; }
.prow.unused .pname, .prow.unused .sw { opacity: .55; }
.prow .tag { font-size: 11px; padding: 0 8px; border-radius: 10px; background: var(--chip-anim); color: var(--chip-anim-ink); margin-left: 6px; font-weight: 600; vertical-align: 1px; }
.prow > div { min-width: 0; }
.sw { display: inline-flex; vertical-align: middle; }
.sw button.c { display: block; width: 28px; height: 24px; padding: 0; margin: 0; border: 1px solid var(--line); border-left-width: 0; border-radius: 0; cursor: copy; position: relative; }
.sw button.c:first-child { border-left-width: 1px; border-radius: 5px 0 0 5px; }
.sw button.c:last-child { border-radius: 0 5px 5px 0; }
.sw button.c:hover { border-color: var(--accent); z-index: 1; }
.sw button.c:focus-visible { z-index: 2; outline-offset: 1px; }
.sw.mini button.c { width: 10px; height: 12px; }
.sw.mini button.c:first-child { border-radius: 3px 0 0 3px; } .sw.mini button.c:last-child { border-radius: 0 3px 3px 0; }
.chip { display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 7px; border-radius: 10px; margin-right: 4px; white-space: nowrap; }
.chip.perm { background: var(--chip-perm); color: var(--chip-perm-ink); }
.chip.venue { background: var(--chip-venue); color: var(--chip-venue-ink); }
.chip.anim { background: var(--chip-anim); color: var(--chip-anim-ink); }
.chip.off { background: var(--chip-off); color: var(--chip-off-ink); }
.strip { display: block; image-rendering: pixelated; border: 1px solid var(--line); margin-top: 4px; }
.groups { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.grp { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; cursor: default; }

/* tiles */
.rbars { display: grid; gap: 9px; }
.rbar { display: grid; grid-template-columns: minmax(120px, 300px) minmax(120px, 1fr) 76px; gap: 4px 14px; align-items: center; }
.rbar .rl { font-size: 13px; display: flex; align-items: center; gap: 7px; min-width: 0; }
.rbar .rl i { flex: none; width: 9px; height: 9px; border-radius: 50%; }
.rbar .n { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.track { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--soft); }
.track span { display: block; height: 100%; }
.track .u { background: var(--accent); } .track .l { background: var(--warn); opacity: .55; }
.track .S { background: #2a9d6f; } .track .V { background: #e08a2c; } .track .A { background: #c43db0; }
.gutter { display: grid; grid-template-columns: 34px max-content; align-items: start; }
.gutter .rows { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.gutter .rows div { text-align: right; padding-right: 4px; }
table.data { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.data th, table.data td { border-top: 1px solid var(--soft); padding: 5px 10px; text-align: left; white-space: nowrap; vertical-align: top; }
table.data th { color: var(--muted); font-weight: 600; }
table.data td.num, table.data th.num { text-align: right; font-family: var(--mono); }
table.data tr.sel td { background: var(--soft); }
table.data.wrap td { white-space: normal; }
table.pal { border-collapse: collapse; width: 100%; }
table.pal td, table.pal th { padding: 8px 10px; border-top: 1px solid var(--soft); vertical-align: top; text-align: left; }
table.pal th { font-size: 12px; color: var(--muted); }
table.free td.fp { white-space: normal; min-width: 84px; font-size: 12.5px; text-align: center; }
table.free td.fp.always { background: var(--chip-perm); color: var(--chip-perm-ink); }
table.free td.fp.event { background: var(--chip-venue); color: var(--chip-venue-ink); }
table.free td.fp.free { background: var(--chip-anim); color: var(--chip-anim-ink); font-weight: 700; }
table.free th[scope=row] { white-space: normal; min-width: 110px; position: sticky; left: 0; background: var(--panel); }
.bossline { font-size: 15px; margin: 4px 0 8px; }

/* events table (More information of the objects section) */
.evrow { display: grid; grid-template-columns: minmax(180px, 1fr) max-content minmax(0, 1.4fr); gap: 6px 16px; align-items: start; padding: 10px 0; }
.evrow + .evrow { border-top: 1px solid var(--soft); }
.evrow > div { min-width: 0; }
.evstills { display: flex; gap: 3px; }
.evpal { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 3px 10px; }
.kids { display: flex; flex-wrap: wrap; gap: 14px; }
.kid { flex: 0 0 auto; max-width: 100%; font-size: 12.5px; }
.klist { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0; padding: 0; list-style: none; }
#tip, #toast { position: fixed; z-index: 60; max-width: min(92vw, 360px); font-size: 12px; line-height: 1.4; padding: 5px 9px; border-radius: 6px; background: var(--ink); color: var(--bg); box-shadow: 0 2px 8px rgba(0,0,0,.3); pointer-events: none; }
#toast { pointer-events: auto; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
#toast input { display: block; width: 100%; margin-top: 4px; font: 12px var(--mono); padding: 3px 5px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }
#toast.fail { background: var(--warn); color: var(--bg); }
@media (max-width: 860px) { .evrow { grid-template-columns: minmax(0, 1fr); } .evstills { flex-wrap: wrap; } }
@media (max-width: 600px) {
  .sbody { padding-left: 16px; padding-right: 12px; }
  .prow { grid-template-columns: minmax(0, 1fr) max-content; }
  .prow .pthumbs { grid-column: 1 / -1; }
  .rbar { grid-template-columns: minmax(0, 1fr) 70px; }
  .rbar .track { grid-column: 1 / -1; grid-row: 2; }
  details.sec > summary { padding: 12px; }
}

</style>

<header class="top">
  <h1 class="vh">Spigoteer Graphics Atlas</h1>
  <div class="pick-wrap">
    <button id="pick-btn" type="button" aria-expanded="false" aria-controls="picker" aria-haspopup="true"><span aria-hidden="true">&#9776;</span><span class="nm" id="pick-name">Screens</span><span aria-hidden="true">&#9662;</span></button>
    <nav class="picker" id="picker" aria-label="Screens" hidden></nav>
  </div>
  <div class="seg" role="group" aria-label="Game Boy model">
    <button id="m-dmg" type="button" aria-pressed="false">DMG</button>
    <button id="m-cgb" type="button" aria-pressed="true">CGB</button>
  </div>
  <div class="gen" id="gen">loading...</div>
</header>

<main id="main" tabindex="-1"><p class="muted">Loading the atlas data...</p></main>

<script src="data/index.js"></script>
<script>
"use strict";
(function () {
  var A = window.ATLAS = window.ATLAS || {};
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function h(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) { c.forEach(function (x) { e.appendChild(x); }); continue; }
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return e;
  }

  var mobile = window.matchMedia("(max-width: 560px)");
  function scale() { return mobile.matches ? 2 : 3; }
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

  var GROUP_ORDER = ["Menus", "Levels (ARCADE, by venue)", "Levels (CLASSIC, mirrored)",
                     "Mini-games", "Story", "Credits", "Pause and cards", "Other"];
  var state = { id: null, model: "cgb", motion: !reduce.matches, bank: 0, open: {}, lastPage: null,
                tiles: { used: true, colour: false, regions: false, region: -1, boss: false }, ov: { attr: false, spr: false, grid: false }, summary: false, free: false };
  var animSwatches = [];     // {cells:[i,i,i,i], changes:[[t,[c..]]], frames}
  var clock0 = performance.now();
  var BAND = { obj: "#e08a2c", pool: "#3a7bd5", shared: "#2a9d6f", patron: "#b04fb0", free: "#8a8a84" };
  var PALCOL = ["#e6194b", "#3cb44b", "#ffe119", "#4363d8", "#f58231", "#911eb4", "#46f0f0", "#f032e6"];
  var SCOPE = { perm: "permanent", venue: "reloaded per venue", free: "free" };

  // ---- small page parts: sections, info and more toggles -----------------------------------------------------------------------
  function plural(n, a, b) { return n + " " + (n === 1 ? a : (b || a + "s")); }
  function shortRole(t) { return String(t || "").replace(/\s*\(.*$/, "").replace(/[;,].*$/, "").trim(); }
  function list(a, pre) { return a.map(function (x) { return (pre || "") + x; }).join(", "); }
  // A section is a <details>: its summary button shows a chevron, the name and a one-line budget; the body is built when it is first opened.
  function section(key, title, summary, build) {
    var d = h("details", { class: "sec", id: "sec-" + key });
    d.appendChild(h("summary", null, h("span", { class: "chev", "aria-hidden": "true" }), h("span", { class: "st", text: title }), h("span", { class: "sum", text: summary })));
    var body = h("div", { class: "sbody" }), built = false;
    d.appendChild(body);
    function fill() { if (built) return; built = true; build(body); }
    d.addEventListener("toggle", function () { state.open[key] = d.open; if (d.open) fill(); });
    if (state.open[key]) { d.open = true; fill(); }
    return d;
  }
  function info(text) {
    return h("details", { class: "info" }, h("summary", { text: "ⓘ info" }), h("p", { class: "note", text: text }));
  }
  // a toggle named plainly ("More information", "Details", "show tile sheet"); the content is built on first open
  function more(label, build, onopen) {
    var d = h("details", { class: "more" }, h("summary", { text: label })), body = h("div", { class: "mbody" }), built = false;
    d.appendChild(body);
    d.addEventListener("toggle", function () { if (d.open) { if (!built) { built = true; build(body); } if (onopen) onopen(true, d); } else if (onopen) onopen(false, d); });
    return d;
  }
  function sprIcon(png, W, H, x, y, w, hh, S, label) {
    var e = sprBox(png, W, H, x, y, w, hh, S, label);
    e.className = "spr obj";
    e.style.backgroundColor = "transparent";
    return e;
  }

  // ---- picker: a button in the top bar that opens the grouped list as a popover --------------------------------------------------
  var pickOpen = false;
  function setPick(on, back) {
    pickOpen = on;
    var nav = $("#picker"), b = $("#pick-btn");
    nav.hidden = !on;
    b.setAttribute("aria-expanded", on ? "true" : "false");
    if (on) { var cur = nav.querySelector('[aria-current="true"]') || nav.querySelector("a"); if (cur) { cur.focus({ preventScroll: true }); cur.scrollIntoView({ block: "nearest" }); } }
    else if (back) b.focus();
  }
  function buildPicker() {
    var nav = $("#picker");
    nav.textContent = "";
    var by = {};
    idx().screens.forEach(function (s) { if (!s.parent) (by[s.group] = by[s.group] || []).push(s); });
    var order = GROUP_ORDER.filter(function (g) { return by[g]; }).concat(Object.keys(by).filter(function (g) { return GROUP_ORDER.indexOf(g) < 0; }));
    nav.appendChild(h("a", { href: "#summary", text: "Summary: permanent vs swapped", "data-id": "summary", class: "top1" }));
    nav.appendChild(h("a", { href: "#free", text: "Free sprite palettes", "data-id": "free", class: "top1" }));
    order.forEach(function (g) {
      var d = h("details", { open: "" }, h("summary", { text: g + " (" + by[g].length + ")" }));
      by[g].forEach(function (s) { d.appendChild(h("a", { href: "#" + s.id, text: s.name, "data-id": s.id })); });
      nav.appendChild(d);
    });
    nav.addEventListener("click", function (e) { if (e.target.closest && e.target.closest("a")) setPick(false); });
    $("#pick-btn").addEventListener("click", function () { setPick(!pickOpen); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && pickOpen) { setPick(false, true); } });
    document.addEventListener("pointerdown", function (e) { if (pickOpen && !$(".pick-wrap").contains(e.target)) setPick(false); });
  }
  function curId() { return state.free ? "free" : state.summary ? "summary" : state.id; }
  function markPicker() {
    var cur = curId();
