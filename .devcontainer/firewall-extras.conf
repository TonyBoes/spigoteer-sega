# Per-project firewall additions for this project.
#
# Baked into the image at build time. Changing it requires rebuilding the
# container - that is deliberate: a writable allowlist could be edited by an
# agent running inside, which has passwordless sudo for init-firewall.sh.
#
# The common allowlist (GitHub, npm, Anthropic, VS Code) is in
# init-firewall.sh and is all most projects need. Add here only what THIS
# project requires, with a comment saying why.
#
# Examples:
#   EXTRA_DOMAINS=( "pypi.org" "files.pythonhosted.org" )   # Python deps
#   EXTRA_INBOUND_TCP_PORTS=( 4200 )                        # Angular dev server

EXTRA_DOMAINS=()
EXTRA_INBOUND_TCP_PORTS=()

# --- from variant: gameboy ---
# gameboy variant: nothing. Both toolchains, both emulators, the asset
# converters, Pan Docs and ~1 GB of reference source are fetched at image
# build time (not subject to init-firewall.sh) and live in the image.
# A project that needs a domain adds it with bin/allow-domain, not here.
EXTRA_DOMAINS+=( )
EXTRA_INBOUND_TCP_PORTS+=( )
